<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ | NU Smart Admin Ecosystem</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="config.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        earth: { 50: '#FDFBF7', 100: '#FAEDCD', 600: '#8C6239', 700: '#6F4E37', 800: '#4A3E3D', 900: '#2E2522', clay: '#A26952', sand: '#D4A373' }
                    }
                }
            }
        }
    </script>
    <style>
        html { font-size: 20px; }
        body { font-family: 'Sarabun', sans-serif; background: linear-gradient(135deg, #FAEDCD 0%, #FAEDCD 30%, #D4A373 100%); }
        .glass-box { background: rgba(255, 255, 255, 0.45); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.5); }
    </style>
</head>
<body class="w-screen h-screen flex items-center justify-center p-4 overflow-hidden relative">

    <div class="w-full max-w-sm glass-box p-8 rounded-3xl shadow-2xl space-y-6">
        <div class="text-center space-y-2">
            <div class="w-14 h-14 bg-earth-900 text-white font-bold text-xl rounded-2xl flex items-center justify-center mx-auto shadow-md">NU</div>
            <h1 class="text-lg font-bold text-earth-900 tracking-wide">Smart Admin Ecosystem</h1>
            <p class="text-xs text-earth-700">ระบบจัดการเวิร์กโฟลว์และพัฒนาทักษะดิจิทัล</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-earth-800 mb-1">ชื่อผู้ใช้งาน (Username)</label>
                <div class="relative">
                    <input type="text" id="username" placeholder="กรอกชื่อผู้ใช้..." class="w-full bg-white/60 border border-white/40 rounded-xl pl-9 pr-3 py-2.5 text-xs text-earth-900 focus:outline-none focus:bg-white focus:ring-2 focus:ring-earth-clay">
                    <i class="fas fa-user absolute left-3 top-3.5 text-earth-700/50 text-xs"></i>
                </div>
            </div>
            <div>
                <label class="block text-xs font-bold text-earth-800 mb-1">รหัสผ่าน (Password)</label>
                <div class="relative">
                    <input type="password" id="password" placeholder="กรอกรหัสผ่าน..." class="w-full bg-white/60 border border-white/40 rounded-xl pl-9 pr-3 py-2.5 text-xs text-earth-900 focus:outline-none focus:bg-white focus:ring-2 focus:ring-earth-clay">
                    <i class="fas fa-lock absolute left-3 top-3.5 text-earth-700/50 text-xs"></i>
                </div>
            </div>

            <button onclick="handleLogin()" id="loginBtn" class="w-full bg-earth-900 hover:bg-earth-800 text-white font-semibold text-xs py-3 rounded-xl shadow-md transition-all">
                ลงชื่อเข้าสู่ใช้งานระบบ
            </button>
        </div>

        <div class="text-[10px] text-center text-earth-800/60 border-t pt-4 border-earth-900/10">
            คณะวิทยาศาสตร์ มหาวิทยาลัยนเรศวร &copy; 2026
        </div>
    </div>

    <!-- Minimal Custom Alert Modal -->
    <div id="customAlert" class="fixed inset-0 bg-black/40 z-[9999] flex items-center justify-center hidden backdrop-blur-sm transition-opacity duration-300 opacity-0 pointer-events-none">
        <div class="bg-white/95 w-[24rem] p-6 rounded-2xl shadow-2xl border border-white/50 transform scale-95 transition-transform duration-300 pointer-events-auto" id="customAlertBox">
            <div class="flex items-center gap-3 mb-4">
                <div class="w-10 h-10 rounded-full flex items-center justify-center text-lg shrink-0" id="alertIconBox">
                    <i id="alertIcon" class="fas fa-info-circle"></i>
                </div>
                <h3 class="text-base font-bold text-earth-900" id="alertTitle">แจ้งเตือน</h3>
            </div>
            <p class="text-sm text-earth-700 mb-6 leading-relaxed" id="alertMessage">ข้อความ</p>
            <div class="flex justify-end gap-2" id="alertButtons"></div>
        </div>
    </div>

    <script>
        let gasUrl = "";

        async function initConfig() {
            try {
                gasUrl = await window.loadScinuConfig();
            } catch (err) {
                console.error("Config fetch error:", err);
            }
        }

        async function handleLogin() {
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();
            const btn = document.getElementById('loginBtn');

            if(!u || !p) {
                await showCustomAlert("กรุณากรอกทั้งชื่อผู้ใช้งานและรหัสผ่านให้ครบถ้วน", "error");
                return;
            }

            if(!gasUrl) {
                gasUrl = await window.loadScinuConfig();
            }

            if(!gasUrl) {
                await showCustomAlert("ยังไม่ได้ตั้งค่า GAS_WEB_APP_URL กรุณาตั้งค่าใน Vercel Environment Variable หรือในไฟล์ config.js หากใช้งานบน GitHub Pages", "error");
                return;
            }

            btn.disabled = true;
            btn.innerText = "กำลังตรวจสอบความปลอดภัย...";

            try {
                const res = await fetch(gasUrl, {
                    method: 'POST',
                    redirect: 'follow',
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ action: "login", username: u, password: p })
                });
                const data = await res.json();

                if(data.status === "success") {
                    sessionStorage.setItem('currentUser', JSON.stringify(data.user));
                    if(data.user.role === 'staff') window.location.href = "staff.html";
                    else if(data.user.role === 'admin') window.location.href = "admin.html";
                    else if(data.user.role === 'management') window.location.href = "management.html";
                } else {
                    await showCustomAlert(data.message, "error");
                    btn.disabled = false;
                    btn.innerText = "ลงชื่อเข้าสู่ใช้งานระบบ";
                }
            } catch(e) {
                await showCustomAlert("เกิดข้อผิดพลาดในการรับส่งข้อมูลกับ API หลังบ้าน กรุณาตรวจสอบการตั้งค่า CORS และสิทธิ์ในสคริปต์", "error");
                btn.disabled = false;
                btn.innerText = "ลงชื่อเข้าสู่ใช้งานระบบ";
            }
        }

        // Enter key to login
        document.addEventListener('keypress', function(e) {
            if(e.key === 'Enter') {
                handleLogin();
            }
        });

        // --- Custom Alert System ---
        function showCustomAlert(message, type = 'info', title = null) {
            return new Promise((resolve) => {
                const modal = document.getElementById('customAlert');
                const box = document.getElementById('customAlertBox');
                const titleEl = document.getElementById('alertTitle');
                const messageEl = document.getElementById('alertMessage');
                const iconBox = document.getElementById('alertIconBox');
                const icon = document.getElementById('alertIcon');
                const btnContainer = document.getElementById('alertButtons');
                
                messageEl.innerText = message;
                
                if(type === 'success') {
                    titleEl.innerText = title || "สำเร็จ";
                    iconBox.className = "w-10 h-10 rounded-full bg-green-100 flex items-center justify-center text-green-600 text-lg shrink-0";
                    icon.className = "fas fa-check";
                    btnContainer.innerHTML = `<button onclick="closeCustomAlert(true)" class="px-5 py-2 bg-earth-900 hover:bg-earth-800 text-white rounded-xl text-sm font-medium transition-all w-full focus:outline-none focus:ring-2 focus:ring-earth-clay">ตกลง</button>`;
                } else if (type === 'error') {
                    titleEl.innerText = title || "เกิดข้อผิดพลาด";
                    iconBox.className = "w-10 h-10 rounded-full bg-red-100 flex items-center justify-center text-red-500 text-lg shrink-0";
                    icon.className = "fas fa-exclamation-triangle";
                    btnContainer.innerHTML = `<button onclick="closeCustomAlert(true)" class="px-5 py-2 bg-red-500 hover:bg-red-600 text-white rounded-xl text-sm font-medium transition-all w-full focus:outline-none focus:ring-2 focus:ring-red-400">ปิด</button>`;
                } else if (type === 'warning') {
                    titleEl.innerText = title || "ยืนยันการดำเนินการ";
                    iconBox.className = "w-10 h-10 rounded-full bg-amber-100 flex items-center justify-center text-amber-500 text-lg shrink-0";
                    icon.className = "fas fa-question";
                    btnContainer.innerHTML = `
                        <button onclick="closeCustomAlert(false)" class="flex-1 px-4 py-2 bg-gray-100 hover:bg-gray-200 text-earth-800 rounded-xl text-sm font-medium transition-all focus:outline-none">ยกเลิก</button>
                        <button onclick="closeCustomAlert(true)" class="flex-1 px-4 py-2 bg-earth-clay hover:bg-earth-700 text-white rounded-xl text-sm font-medium transition-all focus:outline-none">ยืนยัน</button>
                    `;
                } else {
                    titleEl.innerText = title || "แจ้งเตือนระบบ";
                    iconBox.className = "w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-500 text-lg shrink-0";
                    icon.className = "fas fa-info-circle";
                    btnContainer.innerHTML = `<button onclick="closeCustomAlert(true)" class="px-5 py-2 bg-earth-clay hover:bg-earth-700 text-white rounded-xl text-sm font-medium transition-all w-full focus:outline-none focus:ring-2 focus:ring-blue-400">รับทราบ</button>`;
                }
                
                modal.classList.remove('hidden');
                modal.classList.remove('pointer-events-none');
                
                // Set focus to the primary button after a slight delay to allow rendering
                setTimeout(() => { 
                    modal.classList.remove('opacity-0'); 
                    box.classList.remove('scale-95'); 
                    const btn = btnContainer.querySelector('button:last-child');
                    if(btn) btn.focus();
                }, 10);
                
                window.currentAlertResolve = resolve;
            });
        }
        
        function closeCustomAlert(result) {
            const modal = document.getElementById('customAlert');
            const box = document.getElementById('customAlertBox');
            modal.classList.add('opacity-0');
            box.classList.add('scale-95');
            modal.classList.add('pointer-events-none');
            setTimeout(() => { 
                modal.classList.add('hidden'); 
                if(window.currentAlertResolve) window.currentAlertResolve(result); 
            }, 300);
        }

        window.onload = initConfig;
    </script>
</body>
</html>
