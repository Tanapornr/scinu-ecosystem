<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ | NU Smart Admin Ecosystem</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        earth: {
                            50: '#FDFBF7',
                            100: '#FAEDCD',
                            600: '#8C6239',
                            700: '#6F4E37',
                            800: '#4A3E3D',
                            900: '#2E2522',
                            clay: '#A26952',
                            sand: '#D4A373'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background: linear-gradient(135deg, #FAEDCD 0%, #FAEDCD 30%, #D4A373 100%);
        }
        .glass-box {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body class="w-screen h-screen flex items-center justify-center p-4 overflow-hidden">

    <div class="w-full max-w-sm glass-box p-8 rounded-3xl shadow-2xl space-y-6">
        <div class="text-center space-y-2">
            <div class="w-14 h-14 bg-earth-900 text-white font-bold text-xl rounded-2xl flex items-center justify-center mx-auto shadow-md">NU</div>
            <h1 class="text-lg font-bold text-earth-900 tracking-wide">Smart Admin Ecosystem</h1>
            <p class="text-xs text-earth-700">ระบบการจัดการเวิร์กโฟลว์และพัฒนาทักษะดิจิทัล</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-earth-800 mb-1">ชื่อผู้ใช้งาน (Username)</label>
                <div class="relative">
                    <input type="text" id="username" placeholder="กรอกชื่อผู้ใช้..." class="w-full bg-white/60 border border-white/40 rounded-xl pl-9 pr-3 py-2.5 text-xs text-earth-900 focus:outline-none focus:bg-white focus:ring-2 focus:ring-earth-clay">
                    <i class="fas fa-user absolute left-3 top-3.5 text-earth-700/50 text-xs"></i>
                </div>
            </div>
            <div>
                <label class="block text-xs font-bold text-earth-800 mb-1">รหัสผ่าน (Password)</label>
                <div class="relative">
                    <input type="password" id="password" placeholder="กรอกรหัสผ่าน..." class="w-full bg-white/60 border border-white/40 rounded-xl pl-9 pr-3 py-2.5 text-xs text-earth-900 focus:outline-none focus:bg-white focus:ring-2 focus:ring-earth-clay">
                    <i class="fas fa-lock absolute left-3 top-3.5 text-earth-700/50 text-xs"></i>
                </div>
            </div>

            <button onclick="handleLogin()" id="loginBtn" class="w-full bg-earth-900 hover:bg-earth-800 text-white font-semibold text-xs py-3 rounded-xl shadow-md transition-all">
                ลงชื่อเข้าสู่ใช้งานระบบ
            </button>
        </div>

        <div class="text-[10px] text-center text-earth-800/60 border-t pt-4 border-earth-900/10">
            คณะวิทยาศาสตร์ มหาวิทยาลัยนเรศวร &copy; 2026
        </div>
    </div>

    <script>
        let gasUrl = "";

        async function initConfig() {
            try {
                const res = await fetch('/api/config');
                const config = await res.json();
                gasUrl = config.GAS_WEB_APP_URL;
            } catch (err) {
                console.error(err);
                alert("ระบบขัดข้อง: ไม่สามารถดึงไฟล์ config จาก Vercel ได้");
            }
        }

        async function handleLogin() {
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();
            const btn = document.getElementById('loginBtn');

            if(!u || !p) {
                alert("กรุณากรอกทั้งชื่อผู้ใช้งานและรหัสผ่านให้ถูกต้อง");
                return;
            }

            btn.disabled = true;
            btn.innerText = "กำลังตรวจสอบความปลอดภัย...";

            try {
                // อัปเดต Fetch API เพื่อแก้ปัญหา CORS
                const res = await fetch(gasUrl, {
                    method: 'POST',
                    redirect: 'follow', // บังคับให้ตาม Redirect ของ Google
                    headers: {
                        "Content-Type": "text/plain;charset=utf-8", // ใช้ text/plain เพื่อเลี่ยงการพรีไฟลต์ (Preflight) ของเบราว์เซอร์
                    },
                    body: JSON.stringify({ action: "login", username: u, password: p })
                });
                
                const data = await res.json();

                if(data.status === "success") {
                    sessionStorage.setItem('currentUser', JSON.stringify(data.user));
                    
                    // แยกเส้นทางตาม Role
                    if(data.user.role === 'staff') window.location.href = "staff.html";
                    else if(data.user.role === 'admin') window.location.href = "admin.html";
                    else if(data.user.role === 'management') window.location.href = "management.html";
                } else {
                    alert(data.message);
                    btn.disabled = false;
                    btn.innerText = "ลงชื่อเข้าสู่ใช้งานระบบ";
                }
            } catch(e) {
                console.error("CORS Error details:", e);
                alert("เกิดข้อผิดพลาดในการเชื่อมต่อ กรุณาตรวจสอบ ID ของ Google Sheet หรือสิทธิ์การ Deploy ใน Apps Script");
                btn.disabled = false;
                btn.innerText = "ลงชื่อเข้าสู่ใช้งานระบบ";
            }
        }

        window.onload = initConfig;
    </script>
</body>
</html>
